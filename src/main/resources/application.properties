spring.application.name=saideira-backend

# Segredos locais (senha do banco, JWT) ficam em application-local.properties,
# que esta no .gitignore. Em producao, tudo vem de variavel de ambiente.
spring.config.import=optional:classpath:application-local.properties

# Banco
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/saideira}
spring.datasource.username=${DB_USER:saideira_user}
spring.datasource.password=${DB_PASSWORD}

# Hibernate valida o esquema contra as entidades; quem cria as tabelas e o Flyway.
# Campo novo numa entidade exige migration nova, senao a aplicacao nao sobe.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# Carrega amigos/cervejas de varios check-ins numa consulta so (evita N+1 no feed)
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT — sem valor padrao de proposito: sem segredo configurado a aplicacao nao sobe
app.jwt.secret=${JWT_SECRET}
# 30 dias: ninguem quer refazer login no meio do role
app.jwt.validade-ms=${JWT_VALIDADE_MS:2592000000}

# Link de convite montado para o botao "chamar a galera" (endereco do PWA)
app.convite.base-url=${CONVITE_BASE_URL:http://localhost:5173/convite/}

# Sites que podem chamar a API pelo navegador (separados por virgula)
app.cors.origens=${APP_CORS_ORIGENS:http://localhost:5173}

# Todas as datas do app (inicio/fim de desafio, horario do check-in) seguem este fuso.
# Sem isso, num servidor em UTC o dia 31/12 acabaria as 21h de Brasilia.
app.fuso-horario=${APP_FUSO_HORARIO:America/Sao_Paulo}

# Contas com acesso a area de admin (e-mails separados por virgula).
# Vazio = ninguem e admin. Use so e-mail que ja tem conta no app.
app.admin.emails=${APP_ADMIN_EMAILS:}

# Regras anti-farm do check-in
app.checkin.intervalo-minimo-minutos=${CHECKIN_INTERVALO_MINUTOS:120}
app.checkin.max-horas-retroativo=${CHECKIN_MAX_HORAS_RETROATIVO:24}

server.port=${PORT:8280}
